project_id = "credit-card-benefits-tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173/"
additional_redirect_urls = ["http://localhost:5173/"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Keep the email provider active so the seeded owner can use the local-only
# password grant. The project-wide auth.enable_signup=false still blocks new users.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

# This is the only function that deliberately accepts requests without a JWT.
# It authenticates POST requests with the high-entropy X-Scheduler-Secret header.
[functions.process-notifications]
verify_jwt = false
