name: Manual Notification Recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Health performs no writes; process claims and sends eligible notifications
        required: true
        default: health
        type: choice
        options:
          - health
          - process
      confirmation:
        description: Type PROCESS when selecting process (leave blank for health)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: notification-recovery-production
  cancel-in-progress: false

jobs:
  recover:
    name: Invoke protected scheduler endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Require protected main branch
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production recovery must run from main." >&2
            exit 1
          }

      - name: Require explicit send confirmation
        if: inputs.operation == 'process'
        run: |
          [[ "$RECOVERY_CONFIRMATION" == "PROCESS" ]] || {
            echo "Processing requires the exact confirmation PROCESS." >&2
            exit 1
          }
        env:
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}

      - name: Check out recovery client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4

      - name: Invoke health or idempotent recovery processing
        run: node scripts/invoke-notification-recovery.mjs
        env:
          PROCESS_NOTIFICATIONS_URL: ${{ vars.PROCESS_NOTIFICATIONS_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          RECOVERY_MODE: ${{ inputs.operation }}
