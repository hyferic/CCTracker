name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Scan tracked files for common secret formats
        run: node scripts/check-secrets.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_APP_BASE_URL: http://127.0.0.1:4173/
          VITE_BASE_PATH: /

  backend:
    name: Database and Edge integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.4.5

      - name: Install exact dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm exec -- supabase start

      - name: Rebuild database from migrations and seed
        run: npm exec -- supabase db reset --local

      - name: Lint local database functions
        run: npm exec -- supabase db lint --local --fail-on error

      - name: Run database, constraint, grant, RLS, and RPC tests
        run: npm run test:sql

      - name: Run Edge unit and integration tests with fake transport
        run: npm run test:edge

      - name: Lint Edge Function source
        run: deno lint supabase/functions

      - name: Serve scheduler Edge Function with fake transport
        run: |
          npm exec -- supabase functions serve process-notifications \
            --env-file supabase/functions/test.env \
            --no-verify-jwt >"$RUNNER_TEMP/process-notifications.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/process-notifications.pid"
          for attempt in {1..30}; do
            if curl --silent --output /dev/null \
              http://127.0.0.1:54321/functions/v1/process-notifications; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Exercise scheduler authorization and health over HTTP
        run: node scripts/smoke-edge.mjs
        env:
          PROCESS_NOTIFICATIONS_URL: http://127.0.0.1:54321/functions/v1/process-notifications
          SCHEDULER_SECRET: local-test-scheduler-secret-change-me-1234567890
          SMOKE_REQUIRE_SCHEDULER_CONFIG: 'false'

      - name: Exercise real RPC orchestration with fake email delivery
        run: node scripts/invoke-notification-recovery.mjs
        env:
          PROCESS_NOTIFICATIONS_URL: http://127.0.0.1:54321/functions/v1/process-notifications
          SCHEDULER_SECRET: local-test-scheduler-secret-change-me-1234567890
          RECOVERY_MODE: process

      - name: Show local Edge log after failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/process-notifications.log" || true

      - name: Stop local services
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/process-notifications.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/process-notifications.pid")" 2>/dev/null || true
          fi
          npm exec -- supabase stop --no-backup || true

  end-to-end:
    name: Authenticated application and cross-browser auth-shell E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Start and reset local Supabase
        run: |
          npm exec -- supabase start
          npm exec -- supabase db reset --local

      - name: Export actual browser-safe local Supabase configuration
        shell: bash
        run: |
          npm exec -- supabase status -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          local_api_url="${API_URL:-${SUPABASE_URL:-}}"
          local_publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          if [[ -z "$local_api_url" || -z "$local_publishable_key" ]]; then
            echo "Local Supabase did not report an API URL and publishable/anon key." >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$local_api_url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$local_publishable_key"
            echo "VITE_APP_BASE_URL=http://127.0.0.1:4173/"
            echo "E2E_AUTHENTICATED=true"
          } >> "$GITHUB_ENV"

      - name: Run authenticated Chromium and unauthenticated Chromium/WebKit E2E tests
        run: npm run test:e2e

      - name: Upload E2E diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npm exec -- supabase stop --no-backup || true

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review newly introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
