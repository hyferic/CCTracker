name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Type the production Supabase project ref to confirm the target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Supabase backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Require protected main and exact target confirmation
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Backend deployment must run from main." >&2
            exit 1
          }
          [[ "$CONFIRM_PROJECT_REF" == "$SUPABASE_PROJECT_REF" ]] || {
            echo "Project confirmation does not match the protected environment target." >&2
            exit 1
          }
        env:
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Scan source for committed credentials
        run: node scripts/check-secrets.mjs

      - name: Link exact protected Supabase project
        run: >-
          npm exec -- supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Lint linked database
        run: npm exec -- supabase db lint --linked --fail-on error

      - name: Validate pending migration diff without applying it
        run: npm exec -- supabase db push --linked --dry-run

      - name: Apply reviewed migrations
        run: npm exec -- supabase db push --linked

      - name: Lint deployed database functions
        run: npm exec -- supabase db lint --linked --fail-on error

      - name: Deploy only the scheduler Edge Function
        run: >-
          npm exec -- supabase functions deploy process-notifications
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt

      - name: Verify wrong/valid scheduler authentication and backend readiness
        run: node scripts/smoke-edge.mjs
        env:
          PROCESS_NOTIFICATIONS_URL: ${{ vars.PROCESS_NOTIFICATIONS_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SMOKE_REQUIRE_SCHEDULER_CONFIG: 'true'

      - name: Record deployed revision
        run: |
          {
            echo "## Supabase backend deployment"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Project ref: \`$SUPABASE_PROJECT_REF\`"
            echo "- Function: \`process-notifications\`"
            echo "- Health-only smoke: passed (no user email sent)"
          } >>"$GITHUB_STEP_SUMMARY"
